services:

  backend:

    container_name: agro-backend

    image: agro-backend-image

    build:
      context: .
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "4000:4000"

    volumes:

      - /opt/storage/products:/app/public/uploads/products

      - /opt/storage/delivery-proofs:/app/public/uploads/delivery-proofs

      - /opt/storage/seller-shipments:/app/public/uploads/seller-shipments

    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - agro-network

networks:

  agro-network:
    external: true